spring:
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
    parser:
      strict-duplicate-detection: true
  application:
    name: product-activation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USER:activation}
    password: ${DB_PASSWORD:activation}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    connection-timeout: 5s
    max-http-form-post-size: 8KB
activation:
  security:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    audience: ${JWT_AUDIENCE:activation-api}
  provider:
    url: ${PROVIDER_URL:http://localhost:8081}
    token: ${PROVIDER_TOKEN:}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
  worker:
    enabled: ${WORKER_ENABLED:true}
    lease: ${WORKER_LEASE:30s}
    max-attempts: ${WORKER_MAX_ATTEMPTS:5}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging:
  level:
    com.product.activation: ${APP_LOG_LEVEL:INFO}
  structured:
    format:
      console: logstash
